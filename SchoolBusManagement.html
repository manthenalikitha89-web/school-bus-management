<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RouteWise | School Bus Management</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#1f2a3d;font:15px Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.layout{min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:245px;background:#fff;border-right:1px solid #e6ebf2;padding:25px 16px;display:flex;flex-direction:column}.brand{font-size:22px;font-weight:800;color:#3268d7;padding:0 9px 32px}.brand small{display:block;font-size:11px;font-weight:400;color:#8a95a7;margin-top:4px}.nav-label{font-size:10px;letter-spacing:1px;color:#9aa3b1;margin:8px 10px}.nav button{width:100%;border:0;background:transparent;color:#697589;text-align:left;padding:12px;border-radius:8px;margin:2px 0;font-weight:600}.nav button.active,.nav button:hover{background:#edf3ff;color:#3268d7}.nav .count{float:right;color:#8a95a7}.side-foot{margin-top:auto;padding:13px 10px;border-top:1px solid #edf0f4;color:#778296;font-size:12px;line-height:1.6}.main{margin-left:245px}.top{height:62px;background:#fff;border-bottom:1px solid #e6ebf2;display:flex;align-items:center;justify-content:space-between;padding:0 36px;color:#778296;font-size:13px}.online{color:#299469}.content{max-width:1200px;margin:auto;padding:35px 36px}.heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:23px}.eyebrow{font-size:10px;letter-spacing:1.3px;color:#929cad;font-weight:bold;margin-bottom:8px}.heading h1{font-size:26px;margin:0;color:#202b3f}.heading p{font-size:13px;color:#8792a4;margin:8px 0 0}.primary{border:0;border-radius:8px;background:#3971df;color:white;padding:11px 15px;font-weight:bold;font-size:13px}.primary:hover{background:#2c60c2}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{background:#fff;border:1px solid #e8edf3;border-radius:12px}.card{padding:17px}.card-label{font-size:12px;color:#7d899a}.card-number{font-size:29px;font-weight:bold;margin:10px 0 5px}.card-note{font-size:11px;color:#9aa3b1}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:15px;margin-top:17px}.panel-title{padding:18px 19px;border-bottom:1px solid #eef1f5}.panel-title b{font-size:15px}.panel-title p{font-size:11px;color:#929cad;margin:5px 0 0}.route-row{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid #f0f2f6}.route-row:last-child{border:0}.route-icon{width:32px;height:32px;background:#edf3ff;border-radius:8px;display:grid;place-items:center;color:#3971df}.route-detail{flex:1}.route-detail b{font-size:13px}.route-detail small{display:block;color:#8994a5;font-size:11px;margin-top:4px}.route-row time{font-size:11px;color:#697589}.quick{display:block;width:100%;text-align:left;padding:15px 18px;border:0;border-bottom:1px solid #f0f2f6;background:#fff;color:#2e3a50}.quick:hover{background:#fafbfe}.quick small{display:block;color:#909aaa;margin-top:5px;font-size:11px}.toolbar{display:flex;justify-content:space-between;align-items:center;padding:14px 17px;border-bottom:1px solid #edf0f4;color:#8a95a7;font-size:12px}.toolbar b{color:#38445a}.toolbar input{border:1px solid #e2e7ee;border-radius:7px;padding:9px 11px;font-size:12px;width:230px;outline:none}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:620px}th{text-align:left;background:#fbfcfd;color:#98a1af;font-size:10px;letter-spacing:.5px;padding:13px 14px}td{border-top:1px solid #eff1f5;padding:13px 14px;font-size:12px;color:#4b586d}td.actions{text-align:right;white-space:nowrap}td.actions button{border:0;background:#f4f6fa;color:#647187;border-radius:6px;padding:7px 9px;margin-left:4px}.danger{color:#c44c4c!important}.badge{background:#eaf7f0;color:#32946a;border-radius:20px;padding:5px 9px;font-size:10px}.badge.warn{background:#fff3e4;color:#bd792e}.empty{text-align:center;padding:48px 15px;color:#8792a4;font-size:13px}.empty b{display:block;color:#455168;margin-bottom:6px}.foot{text-align:center;padding:23px;color:#a0a8b5;font-size:11px}.modal-bg{position:fixed;inset:0;background:#17243c77;display:grid;place-items:center;padding:15px}.modal{width:min(470px,100%);background:#fff;border-radius:13px;padding:22px;box-shadow:0 15px 60px #17243c44}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h2{margin:0;font-size:20px}.close{border:0;background:#f2f4f8;border-radius:7px;padding:7px 10px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:6px;font-size:11px;font-weight:bold;color:#697589}.field.wide{grid-column:1/-1}.field input,.field select{width:100%;padding:10px;border:1px solid #dfe5ed;border-radius:7px;outline:none;font-size:12px}.field input:focus,.field select:focus{border-color:#3971df}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.secondary{border:1px solid #dfe5ed;background:#fff;color:#59667b;border-radius:8px;padding:10px 14px}.alert{background:#fff1ef;border:1px solid #f2d1cc;color:#a1433a;padding:11px 14px;border-radius:8px;margin-bottom:15px;font-size:12px}.mobile{display:none}
@media(max-width:850px){.side{width:205px}.main{margin-left:205px}.content{padding:26px 20px}.top{padding:0 20px}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
@media(max-width:600px){.side{position:static;width:auto;height:auto;padding:14px;display:block}.brand{padding:0 5px 12px}.nav-label,.side-foot{display:none}.nav{display:flex;overflow:auto;gap:5px}.nav button{white-space:nowrap;width:auto;padding:9px;font-size:12px}.nav .count{margin-left:7px}.main{margin:0}.top{height:46px;padding:0 15px}.content{padding:22px 13px}.heading{align-items:flex-start;gap:10px}.heading h1{font-size:22px}.heading p{font-size:11px;max-width:240px;line-height:1.5}.heading .primary{font-size:11px;padding:10px}.cards{gap:9px}.card{padding:13px}.card-number{font-size:24px}.toolbar{gap:8px}.toolbar input{width:52%}.fields{grid-template-columns:1fr}.field.wide{grid-column:auto}}
</style>
</head>
<body><div class="layout"><aside class="side"><div class="brand">◉ RouteWise<small>School transport management</small></div><div class="nav-label">WORKSPACE</div><nav class="nav" id="nav"></nav><div class="side-foot">School Admin<br>Administrator</div></aside><main class="main"><header class="top"><span id="crumb">Workspace / Overview</span><span class="online">● Demo system</span></header><div class="content" id="app"></div></main></div><div id="modal-root"></div>
<script>
const config={students:{label:'Students',singular:'Student',fields:[['name','Student name','text'],['grade','Grade / class','text'],['guardian','Guardian contact','tel'],['route','Assigned route','text']]},buses:{label:'Buses',singular:'Bus',fields:[['busNumber','Bus number','text'],['registration','Registration number','text'],['capacity','Capacity','number'],['status','Status','select',['Active','Maintenance']] ]},drivers:{label:'Drivers',singular:'Driver',fields:[['name','Driver name','text'],['phone','Phone number','tel'],['license','License number','text']]},routes:{label:'Routes',singular:'Route',fields:[['name','Route name','text'],['busNumber','Bus number','text'],['driver','Driver name','text'],['stops','Stops (comma-separated)','text'],['pickupTime','First pickup time','time']]}};
let db=JSON.parse(localStorage.getItem('routewise-data')||'null')||{students:[],buses:[],drivers:[],routes:[]};let page='dashboard',search='';
function persist(){localStorage.setItem('routewise-data',JSON.stringify(db))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function nav(){document.getElementById('nav').innerHTML=`<button class="${page==='dashboard'?'active':''}" onclick="go('dashboard')">▦ Overview</button>`+Object.entries(config).map(([k,v])=>`<button class="${page===k?'active':''}" onclick="go('${k}')">${v.label}<span class="count">${db[k].length}</span></button>`).join('')}
function go(p){page=p;search='';render()}
function render(){nav();document.getElementById('crumb').textContent='Workspace / '+(page==='dashboard'?'Overview':config[page].label);let app=document.getElementById('app');if(page==='dashboard'){let stops=db.routes.reduce((n,r)=>n+(r.stops?r.stops.split(',').filter(Boolean).length:0),0);app.innerHTML=`<div class="heading"><div><div class="eyebrow">SCHOOL TRANSPORT OVERVIEW</div><h1>Good morning, Admin ✦</h1><p>Here’s what’s happening across your school transport today.</p></div></div><div class="cards">${[['Students',db.students.length,'students registered'],['Active buses',db.buses.filter(x=>x.status!=='Maintenance').length,'ready for routes'],['Drivers',db.drivers.length,'in your directory'],['Routes',db.routes.length,stops+' stops configured']].map(x=>`<div class="card"><div class="card-label">${x[0]}</div><div class="card-number">${x[1]}</div><div class="card-note">${x[2]}</div></div>`).join('')}</div><div class="grid"><section class="panel"><div class="panel-title"><b>Today’s routes</b><p>Route and pickup schedule</p></div>${db.routes.length?db.routes.slice(0,6).map(r=>`<div class="route-row"><div class="route-icon">⌖</div><div class="route-detail"><b>${esc(r.name)}</b><small>${esc(r.stops||'No stops added')}</small></div><time>${esc(r.pickupTime||'—')}</time></div>`).join(''):`<div class="empty"><b>No routes yet</b>Add a route from the Routes section.</div>`}</section><section class="panel"><div class="panel-title"><b>Quick actions</b><p>Common tasks, one click away</p></div>${[['students','Add a student','Register a student and assign a route'],['buses','Add a bus','Update your school bus directory'],['routes','Create a route','Set stops and pickup times']].map(x=>`<button class="quick" onclick="go('${x[0]}');form()"><b>＋ ${x[1]}</b><small>${x[2]}</small></button>`).join('')}</section></div><div class="foot">RouteWise · School transport management</div>`;return}
let c=config[page],records=db[page].filter(x=>Object.values(x).some(v=>String(v).toLowerCase().includes(search.toLowerCase())));app.innerHTML=`<div class="heading"><div><div class="eyebrow">DIRECTORY</div><h1>${c.label}</h1><p>Manage your school’s ${c.label.toLowerCase()} and keep records up to date.</p></div><button class="primary" onclick="form()">＋ Add ${c.singular}</button></div><section class="panel"><div class="toolbar"><span><b>${db[page].length}</b> ${c.label.toLowerCase()} · all records</span><input placeholder="Search ${c.label.toLowerCase()}..." value="${esc(search)}" oninput="search=this.value;renderTable()"></div><div id="table-area">${table(records,c)}</div></section><div class="foot">RouteWise · School transport management</div>`}
function table(records,c){if(!records.length)return `<div class="empty"><b>${search?'No matching records':`No ${c.label.toLowerCase()} yet`}</b>${search?'Try another search.':'Add your first record to get started.'}</div>`;return `<div class="table-wrap"><table><thead><tr>${c.fields.map(f=>`<th>${f[1].replace(' (comma-separated)','')}</th>`).join('')}<th style="text-align:right">ACTIONS</th></tr></thead><tbody>${records.map(r=>`<tr>${c.fields.map(f=>`<td>${f[0]==='status'?`<span class="badge ${r[f[0]]==='Maintenance'?'warn':''}">${esc(r[f[0]||'Active'])}</span>`:esc(r[f[0]]||'—')}</td>`).join('')}<td class="actions"><button onclick="form('${r.id}')">Edit</button><button class="danger" onclick="removeRecord('${r.id}')">Delete</button></td></tr>`).join('')}</tbody></table></div>`}
function renderTable(){let c=config[page],records=db[page].filter(x=>Object.values(x).some(v=>String(v).toLowerCase().includes(search.toLowerCase())));document.getElementById('table-area').innerHTML=table(records,c)}
function form(id=''){let c=config[page],record=db[page].find(x=>x.id===id)||{};document.getElementById('modal-root').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeForm()"><form class="modal" onsubmit="save(event,'${id}')"><div class="modal-head"><h2>${id?'Edit':'Add'} ${c.singular}</h2><button class="close" type="button" onclick="closeForm()">✕</button></div><div class="fields">${c.fields.map(([key,label,type,options])=>`<label class="field ${key==='stops'?'wide':''}">${label}${key!=='stops'?' *':''}${type==='select'?`<select name="${key}" required><option value="">Choose status</option>${options.map(o=>`<option ${record[key]===o?'selected':''}>${o}</option>`).join('')}</select>`:`<input name="${key}" type="${type}" value="${esc(record[key]||'')}" ${key!=='stops'?'required':''} ${type==='number'?'min="1"':''} placeholder="${key==='stops'?'e.g. Main Road, City Park':'Enter '+label.toLowerCase()}">`}</label>`).join('')}</div><div class="modal-actions"><button type="button" class="secondary" onclick="closeForm()">Cancel</button><button class="primary">${id?'Save changes':'Add '+c.singular}</button></div></form></div>`}
function save(e,id){e.preventDefault();let values=Object.fromEntries(new FormData(e.target));let list=db[page];if(id){let i=list.findIndex(x=>x.id===id);list[i]={...list[i],...values}}else list.unshift({id:crypto.randomUUID(),...values});persist();closeForm();render()}
function closeForm(){document.getElementById('modal-root').innerHTML=''}
function removeRecord(id){if(confirm('Delete this record?')){db[page]=db[page].filter(x=>x.id!==id);persist();render()}}
render();
</script></body></html>
